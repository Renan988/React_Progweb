<!doctype html>
<html>
  <head>
    <title>ReactZero - Exercício 1</title>
  </head>

  <body>
    <div id="app"></div>

    <!-- Bibliotecas do React e Babel -->
    <script src="/libs/react.js"></script>
    <script src="/libs/react-dom.js"></script>
    <script src="/libs/babel.js"></script>

    <script type="text/babel">
      // 1. Definição da função TabelaBebidas (Componente)
      function TabelaBebidas() {
        return (
          <table id="tabela" border="1">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Marca</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Havana</td>
                <td>Engenho Anísio Santiago</td>
              </tr>
            </tbody>
          </table>
        );
      }

      // 2. Chamada da função no primeiro parâmetro do ReactDOM.render
      ReactDOM.render(<TabelaBebidas />
      , 
      document.getElementById("app"));
    </script>
  </body>
</html>
